[project]
name = "biomass"
version = "0.1.0"
description = "Above-ground biomass regression from GEDI L4A footprints fused with Sentinel-1/2."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Chavosh Almassian", email = "chavosh@outlook.com" },
]
keywords = ["remote sensing", "biomass", "GEDI", "Sentinel-1", "Sentinel-2", "deep learning", "SAR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core runtime deps: just enough to load configs and read GEDI.
# Heavier deps go in optional-dependencies groups.
dependencies = [
    "earthaccess>=0.10",
    "h5py>=3.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=1.0",
    "pyarrow>=15",
    "shapely>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Sentinel-1/2 acquisition and raster handling.
sentinel = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "stackstac>=0.5",
    "xarray>=2024.1",
    "dask>=2024.1",
    "openeo>=0.30",
    "hyp3-sdk>=7.0",
    "asf-search>=8.0",
    "zarr>=2.18,<3",
    "pyproj>=3.6",
]

# Modeling: tabular baseline + deep learning.
# Note: torch with CUDA must be installed separately (see README); not pinned here.
model = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "wandb>=0.16",
]

# Visualization for notebooks and figures.
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "contextily>=1.5",
    "folium>=0.16",
]

# Dev tooling.
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "mypy>=1.10",
]

# Convenience: install everything.
all = [
    "biomass[sentinel,model,viz,dev]",
]

[project.urls]
Repository = "https://github.com/Chavoshh/gedi-s1s2-agb"
"Bug Tracker" = "https://github.com/Chavoshh/gedi-s1s2-agb/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomass"]

# ---------- Tool configuration ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["data", "notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
    "B008",  # function call in default arg (Hydra/Pydantic patterns)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # script-style imports after setup are fine
"tests/*.py" = ["F401"]    # unused imports OK in test smoke checks

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
warn_unused_ignores = true